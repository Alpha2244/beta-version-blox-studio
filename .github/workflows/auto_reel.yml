name: Auto Generate & Render Blox Reel

on:
  workflow_dispatch:
    inputs:
      story_theme:
        description: "Optional theme/hook idea (leave blank for random original twist)"
        required: false
        default: ""
      voice_engine:
        description: "Voice engine: 'kokoro' (100% FREE unlimited) or 'elevenlabs'"
        required: false
        default: "kokoro"
      voice_tempo:
        description: "Final narration pace multiplier (1.35 to 1.55; default 1.45 fast)"
        required: false
        default: "1.45"
  schedule:
    # Runs daily at 14:00 UTC (7:00 PM PKT)
    - cron: "0 14 * * *"

permissions:
  contents: write

env:
  ENABLE_IG_UPLOAD: "false"
  BLENDER_VERSION: "5.2.0"

jobs:
  render-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 1. Checkout Forked Blox Studio Repo
        uses: actions/checkout@v4

      - name: 1b. Pull Latest @craftee_films Reference Vault (Corpus & Blueprints)
        uses: actions/checkout@v4
        with:
          repository: Alpha2244/craftee-reference-vault
          token: ${{ secrets.VAULT_PAT || github.token }}
          path: reference-vault
          sparse-checkout: |
            vault/blueprints
            vault/master_script_corpus.json
          sparse-checkout-cone-mode: false

      - name: 2. Setup Python 3.11 & Core Deps
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Numpy, Scipy, Pillow & Kokoro TTS
        run: pip install -q "numpy>=1.26.0" "scipy>=1.11.0" "Pillow>=10.0.0" kokoro soundfile

      - name: 3. Install Headless Display, Audio & Mesa OpenGL Drivers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg libgl1-mesa-dri libgl1 libegl1 libxrender1 libxi6 libxkbcommon0 libsm6 espeak-ng

      - name: 4. Cache & Install Blender 5.2
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender 5.2 (if not cached)
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          wget -q "https://download.blender.org/release/Blender5.2/blender-${{ env.BLENDER_VERSION }}-linux-x64.tar.xz" -O /tmp/blender.tar.xz
          mkdir -p ~/blender
          tar -xf /tmp/blender.tar.xz -C ~/blender --strip-components=1
          rm -f /tmp/blender.tar.xz

      - name: Configure Headless Software-GL Blender Wrapper
        run: |
          sudo tee /usr/local/bin/blender_headless > /dev/null << 'EOF'
          #!/bin/bash
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=4.5
          export GALLIUM_DRIVER=llvmpipe
          exec xvfb-run -a -s "-screen 0 1280x720x24" "$HOME/blender/blender" "$@"
          EOF
          sudo chmod +x /usr/local/bin/blender_headless
          echo "BLENDER=/usr/local/bin/blender_headless" >> $GITHUB_ENV

      - name: 5. Generate Vault-Trained Fast-Paced Story & Shot List (Gemini Cascade)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_THEME: ${{ github.event.inputs.story_theme }}
          REFERENCE_VAULT_DIR: ${{ github.workspace }}/reference-vault/vault
        run: |
          RUN_ID="reel_$(date -u +%Y%m%d_%H%M%S)"
          PROJ_DIR="$PWD/kit/projects/$RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV
          python auto/generate_story.py "$PROJ_DIR"

      - name: 6. Synthesize Fast Voice (vo.wav) & Word Timestamps (words.json)
        env:
          VOICE_ENGINE: ${{ github.event.inputs.voice_engine || 'kokoro' }}
          VOICE_TEMPO: ${{ github.event.inputs.voice_tempo || '1.45' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          VOICE_SPEED: "1.20"
        run: |
          python auto/elevenlabs_voice.py "$PROJ_DIR"
          test -s "$PROJ_DIR/vo.wav"
          test -s "$PROJ_DIR/words.json"

      - name: 7. Bulletproof Sanitize + Compile 3D Scene & Bake Full Colors
        run: |
          python - << 'EOF'
          import ast, json, os

          # =========================================================================
          # LAYER 1: AST-Level Guaranteed Replacement of _parse_rgb & _hex in code
          # =========================================================================
          def replace_func_ast(filepath, func_name, new_func_code):
              with open(filepath, "r", encoding="utf-8") as f:
                  src = f.read()
              tree = ast.parse(src)
              lines = src.splitlines(keepends=True)
              target = None
              for node in tree.body:
                  if isinstance(node, ast.FunctionDef) and node.name == func_name:
                      target = node
                      break
              if target is None:
                  # Append if missing
                  src = new_func_code + "\n\n" + src
              else:
                  start = target.lineno - 1
                  end = target.end_lineno
                  src = "".join(lines[:start]) + new_func_code + "\n" + "".join(lines[end:])
              with open(filepath, "w", encoding="utf-8") as f:
                  f.write(src)
              print(f"[AST-Patch] Replaced {func_name}() in {filepath}")

          SAFE_PARSE_RGB = '''def _parse_rgb(col, default=(0.8, 0.8, 0.8)):
              _NAMED = {
                  'red': (0.85, 0.2, 0.2), 'blue': (0.2, 0.45, 0.85), 'green': (0.2, 0.7, 0.3),
                  'yellow': (0.95, 0.8, 0.2), 'gold': (0.95, 0.75, 0.15), 'white': (0.95, 0.95, 0.95),
                  'black': (0.1, 0.1, 0.12), 'gray': (0.5, 0.5, 0.52), 'grey': (0.5, 0.5, 0.52),
                  'brown': (0.45, 0.28, 0.16), 'orange': (0.95, 0.48, 0.15), 'purple': (0.55, 0.25, 0.75),
                  'pink': (0.95, 0.55, 0.7), 'tan': (0.82, 0.68, 0.52), 'peach': (0.96, 0.76, 0.61),
              }
              try:
                  if col is None:
                      return default
                  if isinstance(col, str):
                      s = col.strip().lower()
                      if s in _NAMED:
                          return _NAMED[s]
                      h = s.lstrip('#')
                      if len(h) == 3:
                          h = ''.join(ch * 2 for ch in h)
                      if len(h) >= 6:
                          return (int(h[0:2], 16) / 255.0, int(h[2:4], 16) / 255.0, int(h[4:6], 16) / 255.0)
                      return default
                  if isinstance(col, (list, tuple)) and len(col) >= 3:
                      vals = [float(col[0]), float(col[1]), float(col[2])]
                      if max(vals) > 1.0:
                          vals = [v / 255.0 for v in vals]
                      return tuple(max(0.0, min(1.0, v)) for v in vals)
              except Exception:
                  pass
              return default'''

          SAFE_HEX = '''def _hex(c, default='#a0a0a0'):
              _NAMED = {
                  'red': '#c83c3c', 'blue': '#3c7ab4', 'green': '#4c9a5a', 'yellow': '#e0b43c',
                  'gold': '#e6b830', 'silver': '#c4c8cc', 'white': '#f2f0eb', 'black': '#1e2024',
                  'gray': '#80848a', 'grey': '#80848a', 'brown': '#7a5236', 'wood': '#9c6e44',
                  'orange': '#e07a3c', 'purple': '#8a5aa8', 'pink': '#e08aa8', 'cyan': '#4cb4c8',
              }
              try:
                  if not c:
                      return default
                  if isinstance(c, (list, tuple)) and len(c) >= 3:
                      vals = [float(v) for v in c[:3]]
                      if max(vals) > 1.0:
                          vals = [v / 255.0 for v in vals]
                      return '#%02x%02x%02x' % tuple(int(max(0.0, min(1.0, v)) * 255) for v in vals)
                  if isinstance(c, str):
                      s = c.strip().lower()
                      if s in _NAMED:
                          return _NAMED[s]
                      h = s.lstrip('#')
                      if len(h) == 3 and all(ch in '0123456789abcdef' for ch in h):
                          return '#' + ''.join(ch * 2 for ch in h)
                      if len(h) >= 6 and all(ch in '0123456789abcdef' for ch in h[:6]):
                          return '#' + h[:6]
              except Exception:
                  pass
              return default'''

          replace_func_ast("kit/blox/chars.py", "_parse_rgb", SAFE_PARSE_RGB)
          replace_func_ast("kit/blox/places.py", "_hex", SAFE_HEX)

          # Verify the patched chars.py actually parses '#f5c29b' without crashing!
          with open("kit/blox/chars.py", "r", encoding="utf-8") as f:
              code_check = f.read()
          ns = {}
          exec(compile(SAFE_PARSE_RGB, "<check>", "exec"), ns)
          assert ns["_parse_rgb"]("#f5c29b") == (245/255.0, 194/255.0, 155/255.0), "Self-check failed!"
          print("[Self-Check] _parse_rgb('#f5c29b') verified OK")

          # =========================================================================
          # LAYER 2: Sanitize timed.json directly before Blender ever touches it
          # =========================================================================
          NAMED_RGB = {
              'red': [0.85, 0.2, 0.2], 'blue': [0.2, 0.45, 0.85], 'green': [0.2, 0.7, 0.3],
              'yellow': [0.95, 0.8, 0.2], 'gold': [0.95, 0.75, 0.15], 'white': [0.95, 0.95, 0.95],
              'black': [0.1, 0.1, 0.12], 'gray': [0.5, 0.5, 0.52], 'grey': [0.5, 0.5, 0.52],
              'brown': [0.45, 0.28, 0.16], 'orange': [0.95, 0.48, 0.15], 'purple': [0.55, 0.25, 0.75],
              'pink': [0.95, 0.55, 0.7], 'tan': [0.82, 0.68, 0.52], 'peach': [0.96, 0.76, 0.61],
          }

          def to_rgb_list(col, fallback):
              try:
                  if col is None:
                      return fallback
                  if isinstance(col, str):
                      s = col.strip().lower()
                      if s in NAMED_RGB:
                          return NAMED_RGB[s]
                      h = s.lstrip('#')
                      if len(h) == 3:
                          h = ''.join(ch * 2 for ch in h)
                      if len(h) >= 6:
                          return [round(int(h[0:2], 16) / 255.0, 4), round(int(h[2:4], 16) / 255.0, 4), round(int(h[4:6], 16) / 255.0, 4)]
                      return fallback
                  if isinstance(col, (list, tuple)) and len(col) >= 3:
                      vals = [float(col[0]), float(col[1]), float(col[2])]
                      if max(vals) > 1.0:
                          vals = [v / 255.0 for v in vals]
                      return [round(max(0.0, min(1.0, v)), 4) for v in vals]
              except Exception:
                  pass
              return fallback

          def to_hex_str(col, fallback="#a0a0a0"):
              rgb = to_rgb_list(col, None)
              if rgb is None:
                  return fallback
              return "#%02x%02x%02x" % tuple(int(max(0.0, min(1.0, v)) * 255) for v in rgb)

          VALID_HAIR = {'short', 'curly', 'spiky', 'cap', 'long', 'pigtails', 'bald', 'bun', 'grey_old'}
          VALID_ANIMS = {
              'idle', 'talk', 'walk', 'run', 'point', 'shrug', 'shock', 'scared', 'cheer', 'eat',
              'cross_arms', 'think', 'sad', 'angry', 'wave', 'sit', 'facepalm',
              'hold_hands', 'hold_hands_L', 'hold_hands_R',
              'nod', 'headshake', 'flinch', 'slump', 'jump_joy', 'surrender', 'what', 'clap',
          }
          VALID_EXPRS = {
              'neutral', 'smile', 'grin', 'laugh', 'shock', 'scared', 'sad', 'worried', 'angry',
              'smug', 'think', 'blink', 'happy', 'joy', 'excited', 'fear', 'surprised', 'mad', 'upset', 'confused', 'nervous'
          }

          timed_path = os.path.join(os.environ["PROJ_DIR"], "timed.json")
          data = json.load(open(timed_path, "r", encoding="utf-8"))

          # Sanitize cast colors & hair
          for nm, spec in (data.get("cast") or {}).items():
              if not isinstance(spec, dict):
                  continue
              spec["skin"] = to_rgb_list(spec.get("skin"), [0.96, 0.76, 0.61])
              spec["shirt"] = to_rgb_list(spec.get("shirt"), [0.12, 0.45, 0.95])
              spec["pants"] = to_rgb_list(spec.get("pants"), [0.12, 0.16, 0.25])
              spec["shoes"] = to_rgb_list(spec.get("shoes"), [0.12, 0.12, 0.14])
              spec["hair_color"] = to_rgb_list(spec.get("hair_color"), [0.20, 0.13, 0.08])
              for opt_k in ("cap_color", "tie_color", "apron_color", "inner_color", "skirt_color"):
                  if opt_k in spec:
                      spec[opt_k] = to_rgb_list(spec[opt_k], [0.5, 0.5, 0.5])
              if spec.get("hair") not in VALID_HAIR:
                  spec["hair"] = "short"

          # Sanitize custom places & things hex colors
          for pnm, pspec in (data.get("places") or {}).items():
              if isinstance(pspec, dict):
                  for ck in ("wall", "lower", "floor_color"):
                      if ck in pspec and pspec[ck]:
                          pspec[ck] = to_hex_str(pspec[ck], "#c9c2b2")

          for tnm, parts in (data.get("things") or {}).items():
              if isinstance(parts, list):
                  for pt in parts:
                      if isinstance(pt, list) and len(pt) >= 2:
                          pt[1] = to_hex_str(pt[1], "#a0a0a0")

          # Sanitize shots animations & expressions
          for sh in data.get("shots") or []:
              for cnm, act in (sh.get("do") or {}).items():
                  if isinstance(act, dict):
                      if act.get("anim") and act["anim"] not in VALID_ANIMS:
                          act["anim"] = "idle"
                      if act.get("expr") and act["expr"] not in VALID_EXPRS:
                          act["expr"] = "neutral"

          json.dump(data, open(timed_path, "w", encoding="utf-8"), indent=2)
          print("[Sanitize] Normalized all cast RGBs, place hexes, things, and anims in timed.json")
          EOF

          # Compile 3D Scene (Attempt 1: with custom places & things)
          $BLENDER -b --factory-startup -P kit/blox/compile.py -- "$PROJ_DIR" || true

          # Attempt 2: fallback to built-in sets if custom places failed
          if [ ! -s "$PROJ_DIR/scene.blend" ]; then
            echo "[WARN] Custom places failed to compile; falling back to built-in sets..."
            python - << 'EOF'
          import json, os
          p = os.path.join(os.environ["PROJ_DIR"], "timed.json")
          d = json.load(open(p))
          d.pop("places", None)
          d.pop("things", None)
          valid_sets = {"Street","Kitchen","Gym","MusicRow","TownPool","Bedroom","Hallway","Classroom","LivingRoom","Store","Office","Bathroom","Park","Backyard","Playground"}
          for idx, sh in enumerate(d.get("shots", [])):
              if sh.get("set") not in valid_sets:
                  sh["set"] = ["Street","Park","Classroom","Store","Office","LivingRoom"][idx % 6]
          json.dump(d, open(p, "w"), indent=2)
          EOF
            $BLENDER -b --factory-startup -P kit/blox/compile.py -- "$PROJ_DIR"
          fi
          test -s "$PROJ_DIR/scene.blend"

          cat << 'EOF' > /tmp/cpu_opt.py
          import bpy

          colored_count = 0
          for mat in bpy.data.materials:
              if mat.use_nodes and mat.node_tree:
                  for node in mat.node_tree.nodes:
                      if node.type == "BSDF_PRINCIPLED":
                          base_in = node.inputs.get("Base Color")
                          if base_in and not base_in.is_linked:
                              col = list(base_in.default_value)
                              mat.diffuse_color = (col[0], col[1], col[2], 1.0)
                              colored_count += 1
                              break

          s = bpy.context.scene
          s.render.engine = "BLENDER_WORKBENCH"
          s.render.resolution_percentage = 75
          s.display.shading.light = "STUDIO"
          s.display.shading.color_type = "MATERIAL"
          s.display.shading.show_shadows = True
          s.display.shading.shadow_intensity = 0.45
          s.display.shading.show_cavity = True
          s.display.shading.cavity_type = "BOTH"
          bpy.ops.wm.save_mainfile()
          print(f"[Optimize] Baked vibrant colors onto {colored_count} materials (75% res fast Workbench)")
          EOF
          $BLENDER -b "$PROJ_DIR/scene.blend" --python /tmp/cpu_opt.py

      - name: 8. Render All Frames Safely (Live Frame Counter + Auto-Recovery)
        run: |
          python - << 'EOF'
          import json, math, os, signal, subprocess, sys, time

          ep = os.environ["PROJ_DIR"]
          dur = json.load(open(os.path.join(ep, "timed.json")))["dur"]
          total = int(math.ceil(dur * 30))
          frames_dir = os.path.join(ep, "frames")
          os.makedirs(frames_dir, exist_ok=True)

          print(f"[Render] Rendering {total} frames ({dur:.2f}s @ 30fps) with 2 Workbench workers...", flush=True)

          def run_pass(cmd, label):
              proc = subprocess.Popen(cmd)
              start_t = time.time()
              last_count = sum(1 for f in os.listdir(frames_dir) if f.endswith(".jpg"))
              last_progress_t = start_t
              STALL_LIMIT_SEC = 240

              while proc.poll() is None:
                  time.sleep(20)
                  done = sum(1 for f in os.listdir(frames_dir) if f.endswith(".jpg"))
                  now = time.time()
                  elapsed = now - start_t

                  if done > last_count:
                      last_count = done
                      last_progress_t = now

                  pct = (done / max(total, 1)) * 100.0
                  fpm = (done / max(elapsed, 1.0)) * 60.0
                  rem = max(0, total - done)
                  eta_str = f"{rem / fpm:.1f}m" if fpm > 0 else "warming up..."
                  idle_sec = int(now - last_progress_t)

                  print(
                      f"[{label}] {done} / {total} frames ({pct:5.1f}%) | "
                      f"Speed: {fpm:4.1f} frames/min | ETA: {eta_str} | Idle: {idle_sec}s",
                      flush=True,
                  )

                  if idle_sec >= STALL_LIMIT_SEC:
                      print(f"[WARN] {label} stalled for {idle_sec}s! Recovering remaining frames...", flush=True)
                      proc.send_signal(signal.SIGTERM)
                      time.sleep(5)
                      proc.kill()
                      return False
              return proc.returncode == 0

          run_pass(["python", "kit/blox/render_par.py", ep, "2"], "Pass 1")

          for recovery_attempt in range(1, 4):
              missing = [str(i) for i in range(total) if not os.path.exists(os.path.join(frames_dir, f"{i:05d}.jpg"))]
              if not missing:
                  break
              print(f"[Recovery {recovery_attempt}] Rendering {len(missing)} remaining frames...", flush=True)
              run_pass([
                  "python", "kit/blox/render_par.py", ep, "1",
                  "--frames", ",".join(missing), "--out", "frames"
              ], f"Recovery {recovery_attempt}")

          final_missing = [i for i in range(total) if not os.path.exists(os.path.join(frames_dir, f"{i:05d}.jpg"))]
          if final_missing:
              sys.exit(f"[ERROR] Still missing {len(final_missing)} frames after recovery.")
          print(f"[Guard] All {total} / {total} frames verified on disk!", flush=True)
          EOF

      - name: 9. Strip All Watermarks/End-Card & Post-Process Final MP4
        run: |
          python - << 'EOF'
          post_file = "kit/blox/post.py"
          with open(post_file, "r", encoding="utf-8") as f:
              src = f.read()
          src = src.replace("TAG_S = 0.6", "TAG_S = 0.0")
          src = src.replace("META = {'title': 'Made with Beta Version Blox Studio'", "META = {'title': 'Generated Reel'")
          src = src.replace("base.alpha_composite(p, (x, y))", "pass")
          src = src.replace("im.alpha_composite(mp, (mx, my))", "pass")
          with open(post_file, "w", encoding="utf-8") as f:
              f.write(src)
          print("[Clean] Stripped top-right watermark, β. caption badge, and end card from post.py")
          EOF
          python kit/blox/post.py "$PROJ_DIR"
          OUT_MP4="$PROJ_DIR/out/${RUN_ID}.mp4"
          test -s "$OUT_MP4"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$OUT_MP4"
          cp "$OUT_MP4" "$PWD/${RUN_ID}.mp4"
          cp "$PROJ_DIR/meta.json" "$PWD/meta.json"

      - name: 10. Upload MP4 as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RUN_ID }}
          path: |
            ${{ env.RUN_ID }}.mp4
            meta.json
          retention-days: 30

      - name: 11. Publish MP4 to GitHub Releases (Easy Browser Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RUN_ID }}
          name: "Generated Reel — ${{ env.RUN_ID }}"
          body_path: meta.json
          files: ${{ env.RUN_ID }}.mp4

      - name: 12. Instagram Reels Upload (Skipped While ENABLE_IG_UPLOAD=false)
        env:
          RELEASE_VIDEO_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.RUN_ID }}/${{ env.RUN_ID }}.mp4
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python auto/publish_reel.py "$PROJ_DIR"
