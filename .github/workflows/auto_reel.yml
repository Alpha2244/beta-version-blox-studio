name: Render @craftee_films Style 3D Reel

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Optional story theme (leave blank for auto-generated viral @craftee_films twist)"
        required: false
        default: ""
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Blox Studio Repository
        uses: actions/checkout@v4

      - name: 2. Checkout Harvested @craftee_films Reference Vault
        uses: actions/checkout@v4
        with:
          repository: Alpha2244/craftee-reference-vault
          path: reference-vault

      - name: 3. Setup Python 3.11 & Install Blender + FFmpeg + Voice
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg blender xvfb espeak-ng libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1
          pip install -q -r kit/requirements.txt
          pip install -q -r kit/requirements-voice.txt

      - name: 4. Generate Story & Shot Plan from @craftee_films Vault
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CRAFTEE_VAULT_DIR: ${{ github.workspace }}/reference-vault/vault
          STORY_THEME: ${{ github.event.inputs.theme || '' }}
        run: |
          mkdir -p kit/projects/daily_reel
          SCRIPT=$(find . -maxdepth 3 -name "generate_cloned_story.py" -not -path './reference-vault*' | head -n 1)
          test -n "$SCRIPT" || { echo "generate_cloned_story.py not found"; exit 1; }
          python "$SCRIPT" kit/projects/daily_reel

      - name: 5. Run Voice, Compile, Render & Post via kit/run.py
        env:
          BLENDER: /usr/bin/blender
        run: |
          xvfb-run -a python kit/run.py kit/projects/daily_reel voice compile render post

      - name: 6. Upload Finished MP4 Reel & Metadata Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blox-studio-rendered-reel-${{ github.run_number }}
          path: |
            kit/projects/daily_reel/out/daily_reel.mp4
            kit/projects/daily_reel/timed.json
            kit/projects/daily_reel/meta.json
          retention-days: 14
